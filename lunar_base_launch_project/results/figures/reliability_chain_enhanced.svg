<text x="1246.0" y="287.0" class="metric" text-anchor="middle">0.871</text>
<rect x="180" y="370" width="1140" height="42" rx="12" fill="#f6f8fb" stroke="#d9e1e8"/>
<text x="214.0" y="397.0" class="mono" text-anchor="start">R = 0.95^2 x 0.98 x 0.985 = 0.871</text>
<text x="680.0" y="397.0" class="body" text-anchor="start">Launch-only two-CZ10 reliability would be 0.902; in-orbit operations reduce it by 0.031.</text>
<rect x="58" y="490" width="652" height="330" rx="18" class="panel"/>
<text x="92.0" y="528.0" class="section" text-anchor="start">Architecture reliability comparison</text>
<text x="96.0" y="589.0" class="label" text-anchor="start">Two launch only</text>
