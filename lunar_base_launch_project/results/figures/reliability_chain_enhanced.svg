<text x="750.0" y="54.0" class="title" text-anchor="middle">Enhanced Fig. 10: Reliability Chain and Sensitivity</text>
<text x="750.0" y="82.0" class="subtitle" text-anchor="middle">The baseline is not only two launches; LEO rendezvous and TLI are explicit serial reliability factors.</text>
<rect x="58" y="116" width="1384" height="336" rx="18" class="panel"/>
<text x="92.0" y="154.0" class="section" text-anchor="start">Serial mission chain</text>
