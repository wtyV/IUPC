<text x="206.0" y="248.0" class="label" text-anchor="middle">Launch A</text>
<text x="206.0" y="287.0" class="metric" text-anchor="middle">0.950</text>
<line x1="310" y1="268" x2="358" y2="268" stroke="#9fb0bf" stroke-width="2.4" marker-end="url(#arrow-muted)"/>
