<text x="466.0" y="287.0" class="metric" text-anchor="middle">0.950</text>
<line x1="570" y1="268" x2="618" y2="268" stroke="#9fb0bf" stroke-width="2.4" marker-end="url(#arrow-muted)"/>
<rect x="632" y="214" width="188" height="108" rx="14" fill="#ffffff" stroke="#d9822b" stroke-width="2.4"/>
