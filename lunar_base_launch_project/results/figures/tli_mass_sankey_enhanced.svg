<text x="118.0" y="735.0" class="label" text-anchor="start">Interpretation</text>
<text x="236.0" y="735.0" class="body" text-anchor="start">The 40 t payload is not a single launch load: two ~48.5 t LEO wet-mass insertions assemble a ~96.9 t TLI stack, of which ~49.0 t is propellant.</text>
